<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Wana Bingo Game</title>
    <style>
        body { background-color: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        .room-btn { background: #10b981; border: none; padding: 15px; margin: 10px; width: 80%; color: white; font-size: 18px; border-radius: 8px; }
        .keno-board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 20px; }
        .num-btn { background: #334155; padding: 10px; border: none; color: white; cursor: pointer; }
        .num-btn.selected { background: #eab308; }
    </style>
</head>
<body>
    <h1>ዋና ቢንጎ መጫወቻ</h1>
    <div id="room-selection">
        <p>እባክዎ መጫወት የሚፈልጉትን የክፍያ መጠን ይምረጡ፦</p>
        <button class="room-btn" onclick="startGame(20)">20 ብር</button>
        <button class="room-btn" onclick="startGame(50)">50 ብር</button>
        <button class="room-btn" onclick="startGame(100)">100 ብር</button>
        <button class="room-btn" onclick="startGame(500)">500 ብር</button>
        <button class="room-btn" onclick="startGame(1000)">1000 ብር</button>
    </div>

    <div id="game-board" style="display:none;">
        <div class="keno-board" id="board"></div>
    </div>

    <script>
        function startGame(amount) {
            document.getElementById('room-selection').style.display = 'none';
            document.getElementById('game-board').style.display = 'block';
            const board = document.getElementById('board');
            for(let i=1; i<=80; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i;
                btn.onclick = () => btn.classList.toggle('selected');
                board.appendChild(btn);
            }
        }
    </script>
</body>
</html>
