<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wana Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2e1065; color: #fff; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 450px; margin: 0 auto; }
        .hidden { display: none !important; }

        /* Wallet Bar */
        .wallet-card { background: #3b0764; border: 1px solid #6b21a8; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .wallet-title { font-size: 11px; color: #cbd5e1; text-align: left; }
        .wallet-amount { font-size: 16px; font-weight: bold; color: #38bdf8; text-align: left; }
        .wallet-btns button { padding: 5px 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 11px; margin-left: 4px; }
        .deposit-btn { background: #10b981; color: #fff; }
        .withdraw-btn { background: #f97316; color: #fff; }

        /* Room Cards */
        .room-card { background: #3b0764; border: 1px solid #6b21a8; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .room-name { font-size: 10px; color: #38bdf8; letter-spacing: 1px; margin-bottom: 2px; text-align: left; }
        .room-price { font-size: 16px; font-weight: bold; color: #22d3ee; text-align: left; }
        .join-btn { background: #ef4444; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Game Board Style - 1 እስከ 100 ሙሉ በሙሉ እንዲታይ የተደረገ */
        .keno-board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-bottom: 10px; }
        .keno-btn { background: #4c1d95; color: #fff; border: 1px solid #7c3aed; padding: 5px 0; border-radius: 3px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .keno-btn.selected { background: #22c55e !important; }
        .keno-btn:disabled { background: #475569 !important; color: #94a3b8; cursor: not-allowed; }

        /* 5x5 Ticket Grid - ትንሽ ተደርጎ ወደ ታች እንዲወርድ የተደረገ */
        .action-container { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .sub-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background: #3b0764; padding: 6px; border-radius: 6px; width: 170px; }
        .sub-btn { background: #fff; color: #000; border: none; padding: 6px 0; font-size: 10px; font-weight: bold; border-radius: 3px; text-align: center; }
        .sub-btn.star { background: #22c55e; color: #fff; }
        
        .action-btns button { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 4px; width: 90px; display: block; font-size: 11px; }
        .refresh-btn { background: #0284c7; color: white; }
        .start-game-btn { background: #f59e0b; color: black; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. ዋናው የክፍሎች ገጽ (Dashboard) -->
        <div id="dashboard-section">
            <div class="wallet-card">
                <div>
                    <div class="wallet-title">Wallet Balance</div>
                    <div class="wallet-amount" id="balance">0.00 ETB</div>
                </div>
                <div>
                    <button class="deposit-btn" onclick="alert('ዲፖዚት ለማድረግ ቦቱ ላይ ያለውን አማራጭ ይጠቀሙ')">ገንዘብ አስገባ</button>
                    <button class="withdraw-btn" onclick="alert('ዊዝድራው ለማድረግ ቦቱ ላይ ያለውን አማራጭ ይጠቀሙ')">አውጣ</button>
                </div>
            </div>

            <div id="rooms-container">
                <div class="room-card">
                    <div><div class="room-name">WANA BINGO</div><div class="room-price">20 ETB</div></div>
                    <button class="join-btn" onclick="openGameRoom(20)">Join</button>
                </div>
                <div class="room-card">
                    <div><div class="room-name">WANA BINGO</div><div class="room-price">50 ETB</div></div>
                    <button class="join-btn" onclick="openGameRoom(50)">Join</button>
                </div>
                <div class="room-card">
                    <div><div class="room-name">WANA BINGO</div><div class="room-price">100 ETB</div></div>
                    <button class="join-btn" onclick="openGameRoom(100)">Join</button>
                </div>
                <div class="room-card">
                    <div><div class="room-name">WANA BINGO</div><div class="room-price">500 ETB</div></div>
                    <button class="join-btn" onclick="openGameRoom(500)">Join</button>
                </div>
                <div class="room-card">
                    <div><div class="room-name">WANA BINGO</div><div class="room-price">1000 ETB</div></div>
                    <button class="join-btn" onclick="openGameRoom(1000)">Join</button>
                </div>
            </div>
        </div>

        <!-- 2. የጨዋታ ቦርድ ገጽ -->
        <div id="game-section" class="hidden">
            <div class="wallet-card">
                <div>Wallet <span id="game-wallet">0.00</span></div>
                <div>Stake: <span id="room-stake">0</span> ETB</div>
            </div>

            <!-- ከ 1 እስከ 100 ያሉት ቁጥሮች ሙሉ በሙሉ በአንድ ላይ የሚታዩበት ቦርድ -->
            <div class="keno-board" id="mainKenoBoard"></div>

            <div class="action-container">
                <!-- የ 5x5 ካርቴላ ከታች በግራ በኩል -->
                <div class="sub-board" id="subTicketBoard"></div>
                <!-- አዝራሮች በስተቀኝ -->
                <div class="action-btns">
                    <button class="refresh-btn" onclick="resetSelection()">Refresh</button>
                    <button class="start-game-btn" onclick="alert('ጨዋታው ተጀምሯል!')">Start game</button>
                </div>
            </div>

            <br>
            <button style="background: #64748b; color: white; padding: 6px 12px; border:none; border-radius:5px; cursor:pointer; width:100%; font-size:12px;" onclick="backToDashboard()">ወደ ዋናው ገጽ ተመለስ</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUserPhone = null;
        let currentAmount = 0;
        let selectedNumber = null;
        let takenNumbersGlobal = [];

        window.addEventListener('DOMContentLoaded', async () => {
            const tg = window.Telegram.WebApp;
            tg.expand();

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                currentUserPhone = tg.initDataUnsafe.user.id.toString();
                try {
                    const res = await fetch(`/api/user/${currentUserPhone}`);
                    const data = await res.json();
                    if (res.ok) {
                        document.getElementById('balance').textContent = `${data.balance} ETB`;
                        document.getElementById('game-wallet').textContent = data.balance;
                    }
                } catch (e) {
                    console.error('መረጃ ማምጣት አልተቻለም');
                }
            }
        });

        function openGameRoom(amount) {
            currentAmount = amount;
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('room-stake').textContent = amount;
            
            selectedNumber = null;
            socket.emit('joinRoom', { amount });
            buildGameBoards();
        }

        function backToDashboard() {
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        socket.on('syncTakenNumbers', (takenList) => {
            takenNumbersGlobal = takenList;
            buildGameBoards();
        });

        socket.on('numberTaken', (num) => {
            if (!takenNumbersGlobal.includes(num)) {
                takenNumbersGlobal.push(num);
            }
            const btn = document.getElementById(`kbtn-${num}`);
            if (btn) {
                btn.disabled = true;
            }
        });

        function selectNumber(num) {
            selectedNumber = num;
            socket.emit('selectNumber', { amount: currentAmount, number: num });
            buildGameBoards();
        }

        function resetSelection() {
            selectedNumber = null;
            buildGameBoards();
        }

        function generateCardNumbers(seed) {
            let numbers = [];
            for (let i = 1; i <= 99; i++) {
                if (i !== seed) numbers.push((i * seed * 7) % 90 + 1);
            }
            let uniqueNums = [...new Set(numbers)];
            return uniqueNums.slice(0, 24);
        }

        function buildGameBoards() {
            const mainBoard = document.getElementById('mainKenoBoard');
            mainBoard.innerHTML = '';
            
            for (let i = 1; i <= 100; i++) {
                const btn = document.createElement('button');
                btn.className = 'keno-btn';
                btn.id = `kbtn-${i}`;
                btn.textContent = i;

                if (takenNumbersGlobal.includes(i)) {
                    btn.disabled = true;
                }
                
                if (selectedNumber === i) {
                    btn.classList.add('selected');
                }

                btn.onclick = () => selectNumber(i);
                mainBoard.appendChild(btn);
            }

            updateTicketDisplay();
        }

        function updateTicketDisplay() {
            const subBoard = document.getElementById('subTicketBoard');
            subBoard.innerHTML = '';

            let cardNums = selectedNumber !== null ? generateCardNumbers(selectedNumber) : Array(24).fill('');
            let cardIndex = 0;

            for (let i = 0; i < 25; i++) {
                const sBtn = document.createElement('div');
                sBtn.className = 'sub-btn';

                if (i === 12) {
                    sBtn.textContent = '*';
                    sBtn.classList.add('star');
                } else {
                    sBtn.textContent = cardNums[cardIndex] !== undefined ? cardNums[cardIndex] : '';
                    cardIndex++;
                }
                subBoard.appendChild(sBtn);
            }
        }
    </script>
</body>
</html>
