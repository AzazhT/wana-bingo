<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wana Bingo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #12122b; color: #fff; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 420px; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; background: #1a1a3a; }
    
    /* Top Header */
    .header-card { background: #0f2b48; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .balance-title { font-size: 12px; color: #a0a0a0; }
    .balance-amount { font-size: 20px; font-weight: bold; }
    .btn-action { border: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .btn-deposit { background: #28a745; color: #fff; margin-right: 5px; }
    .btn-withdraw { background: #fd7e14; color: #fff; }

    /* Bet Rooms List */
    .room-card { background: #183c5a; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1f4e75; }
    .room-bet { font-size: 18px; font-weight: bold; color: #00d8d6; }
    .btn-join { background: #ff3f34; color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* Bottom Nav */
    .nav-bar { margin-top: auto; display: flex; justify-content: space-around; background: #0f2b48; padding: 12px 0; border-radius: 12px; }
    .nav-item { color: #888; font-size: 12px; text-align: center; cursor: pointer; }
    .nav-item.active { color: #00d8d6; font-weight: bold; }

    /* Page Views */
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }

    /* Selection Board (1-100) Layout */
    .selection-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; background: #0f2b48; padding: 8px; border-radius: 10px; margin-bottom: 10px; }
    .select-cell { background: #2a2a5a; font-size: 10px; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; border-radius: 3px; cursor: pointer; user-select: none; }
    .select-cell.taken { background: #ff9f1a; color: #000; font-weight: bold; cursor: not-allowed; } 
    .select-cell.selected { background: #28a745; color: #fff; font-weight: bold; box-shadow: 0 0 8px #28a745; } 

    .card-preview-container { background: #0f2b48; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; }

    /* Main Game UI Layout */
    .stats-row { display: flex; justify-content: space-between; background: #0f2b48; padding: 8px; border-radius: 8px; font-size: 10px; margin-bottom: 10px; text-align: center; }
    .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex-grow: 1; }
    
    .board-75 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #0f2b48; padding: 5px; border-radius: 8px; }
    .board-cell { background: #2a2a5a; font-size: 9px; display: flex; justify-content: center; align-items: center; border-radius: 3px; aspect-ratio: 1; }
    .board-cell.called { background: #ff9f1a; color: #000; font-weight: bold; }

    .current-call-box { background: #0f2b48; border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 10px; }
    .call-circle { width: 60px; height: 60px; border-radius: 50%; background: #0056b3; border: 3px solid #00d8d6; display: flex; justify-content: center; align-items: center; margin: 5px auto; font-size: 24px; font-weight: bold; color: #fff; box-shadow: 0 0 15px #00d8d6; }

    /* የተስተካከለው የዩዘር ካርድ መጠን እና የከፍታ/ዝቅታ ክፍተት (Margin) */
    .player-card { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 2px; 
      background: #fff; 
      padding: 4px; 
      border-radius: 6px; 
      color: #000; 
      width: 130px; 
      margin-top: 8px;   /* ከላይ ትንሽ እንዲወርድ (ክፍተት እንዲኖር) ተደርጓል */
      margin-bottom: 8px; /* ከታች ትንሽ ከፍ እንዲል ተደርጓል */
      margin-left: auto;
      margin-right: auto;
    }
    
    .card-cell { background: #e0e0e0; font-size: 10px; display: flex; justify-content: center; align-items: center; border-radius: 2px; aspect-ratio: 1; font-weight: bold; }
    .card-cell.matched { background: #28a745; color: #fff; }

    /* Controls */
    .controls { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    .btn-bingo { background: #ff793f; color: #fff; border: none; padding: 14px; border-radius: 25px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; }
    .btn-sub-group { display: flex; gap: 10px; }
    .btn-refresh { background: #17c0eb; color: #fff; border: none; padding: 10px; border-radius: 20px; font-weight: bold; flex: 1; cursor: pointer; }
    .btn-leave { background: #ff3838; color: #fff; border: none; padding: 10px; border-radius: 20px; font-weight: bold; flex: 1; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- PAGE 1: BET ROOMS -->
    <div id="page-rooms" class="page active">
      <div class="header-card">
        <div>
          <div class="balance-title">Wallet Balance</div>
          <div class="balance-amount">0 ETB</div>
        </div>
        <div>
          <button class="btn-action btn-deposit">+ Deposit</button>
          <button class="btn-action btn-withdraw">- Withdraw</button>
        </div>
      </div>

      <div class="room-card"><span class="room-bet">20 ETB</span><button class="btn-join" onclick="showPage('page-select')">Join</button></div>
      <div class="room-card"><span class="room-bet">50 ETB</span><button class="btn-join" onclick="showPage('page-select')">Join</button></div>
      <div class="room-card"><span class="room-bet">100 ETB</span><button class="btn-join" onclick="showPage('page-select')">Join</button></div>
      <div class="room-card"><span class="room-bet">500 ETB</span><button class="btn-join" onclick="showPage('page-select')">Join</button></div>
      <div class="room-card"><span class="room-bet">1000 ETB</span><button class="btn-join" onclick="showPage('page-select')">Join</button></div>

      <div class="nav-bar">
        <div class="nav-item">Leaderboard</div>
        <div class="nav-item active">Play</div>
        <div class="nav-item">Profile</div>
      </div>
    </div>

    <!-- PAGE 2: CARD SELECTION (1-100) -->
    <div id="page-select" class="page">
      <div class="stats-row">
        <div>Wallet<br><b>40.00</b></div>
        <div>Active Game<br><b>1</b></div>
        <div>Stake<br><b>50</b></div>
      </div>

      <!-- 1-100 Grid -->
      <div class="selection-grid" id="select-grid"></div>

      <!-- Preview 5x5 Card -->
      <div class="card-preview-container">
        <div style="font-size: 11px; margin-bottom: 5px; color: #a0a0a0;" id="card-label">ካርድ ለመመልከት ቁጥር ይምረጡ</div>
        <div class="player-card" id="preview-card"></div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="btn-sub-group">
          <button class="btn-refresh">Refresh</button>
          <button class="btn-bingo" style="background:#ff9f1a; font-size:14px;" onclick="showPage('page-game')">Start Game</button>
        </div>
      </div>
    </div>

    <!-- PAGE 3: MAIN GAME -->
    <div id="page-game" class="page">
      <div class="stats-row">
        <div>GAME<br><b>BQ8449</b></div>
        <div>DERASH<br><b>935.0</b></div>
        <div>BONUS<br><b>ON</b></div>
        <div>PLAYERS<br><b>22</b></div>
        <div>BET<br><b>50</b></div>
        <div>CALL<br><b>0</b></div>
      </div>

      <div class="game-grid">
        <!-- 1-75 Main Board -->
        <div class="board-75" id="main-board"></div>

        <!-- Right Side: Current Call & Card -->
        <div>
          <div class="current-call-box">
            <div style="font-size: 11px; color: #a0a0a0;">Current Call:</div>
            <div class="call-circle" id="current-call-display">37</div>
          </div>

          <div class="player-card" id="player-card"></div>
        </div>
      </div>

      <!-- Bottom Controls -->
      <div class="controls">
        <button class="btn-bingo">BINGO!</button>
        <div class="btn-sub-group">
          <button class="btn-refresh">Refresh</button>
          <button class="btn-leave" onclick="showPage('page-select')">Leave</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    const takenNumbers = [11, 22, 34, 49, 60, 77, 88, 95]; 
    let selectedNumber = null;

    const selectGrid = document.getElementById('select-grid');
    const previewCard = document.getElementById('preview-card');
    const cardLabel = document.getElementById('card-label');

    for (let i = 1; i <= 100; i++) {
      const cell = document.createElement('div');
      cell.className = 'select-cell';
      cell.innerText = i;
      
      if (takenNumbers.includes(i)) {
        cell.classList.add('taken');
      } else {
        cell.onclick = () => selectCardNumber(i, cell);
      }
      
      selectGrid.appendChild(cell);
    }

    function selectCardNumber(num, element) {
      document.querySelectorAll('.select-cell.selected').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      selectedNumber = num;
      cardLabel.innerText = `የካርድ ቁጥር ${num} ቅድመ-እይታ`;

      generateBingoCard(previewCard, num);
      generateBingoCard(document.getElementById('player-card'), num);
    }

    function generateBingoCard(container, seed) {
      container.innerHTML = '';
      let cardNumbers = [];
      for(let i = 0; i < 25; i++) {
        if(i === 12) {
          cardNumbers.push('★');
        } else {
          let val = ((seed * (i + 1) * 7) % 75) + 1;
          cardNumbers.push(val);
        }
      }

      cardNumbers.forEach((val) => {
        const cell = document.createElement('div');
        cell.className = 'card-cell';
        cell.innerText = val;
        container.appendChild(cell);
      });
    }

    const mainBoard = document.getElementById('main-board');
    for (let i = 1; i <= 75; i++) {
      const cell = document.createElement('div');
      cell.className = 'board-cell';
      cell.innerText = i;
      if (i === 37) cell.classList.add('called');
      mainBoard.appendChild(cell);
    }
  </script>
</body>
</html>
