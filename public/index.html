<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>እድል ቢንጎ Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(22, 30, 49, 0.75);
            --card-border: rgba(255, 255, 255, 0.15);
            --primary-cyan: #00f2fe;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #ff2a5f;
            --accent-purple: #a855f7;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: radial-gradient(circle at top, #111827 0%, #070a12 100%); color: #fff; padding-bottom: 65px; min-height: 100vh; }

        .header { background: rgba(15, 23, 42, 0.85); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); }
        .logo { font-size: 18px; font-weight: 900; color: var(--primary-cyan); }
        .balance-badge { background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; font-weight: 800; color: var(--accent-green); }

        .container { padding: 8px; max-width: 500px; margin: 0 auto; }
        .tab-content, .game-step { display: none; }
        .tab-content.active, .game-step.active { display: block; }

        .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid var(--card-border); }
        .nav-item { color: var(--text-sub); font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary-cyan); }

        .card { background: var(--card-bg); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--card-border); }
        .btn { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: 800; cursor: pointer; }

        /* 🌟 የተጠሩ ቁጥሮች ስታይል (የአሁኗ ቁጥር ደምቃና ጎልታ እንድትታይ) */
        .called-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
        .grid-num { 
            background: rgba(255, 255, 255, 0.05); 
            color: rgba(255, 255, 255, 0.2); /* ያልተጠሩት በጣም ደበዝ ያሉ */
            font-size: 11px; text-align: center; padding: 6px 0; border-radius: 4px; font-weight: 800; 
        }
        
        /* ቀደም ብለው የተጠሩት (Dimmed / Medium Faded) */
        .grid-num.called { 
            background: rgba(255, 42, 95, 0.35) !important; 
            color: rgba(255, 255, 255, 0.7) !important; 
            border: 1px solid rgba(255, 42, 95, 0.4);
        }

        /* 💥 አሁን የተጠራችዋ ቁጥር (CURRENT CALL - BRIGHT & GLOWING) */
        .grid-num.latest-call { 
            background: linear-gradient(135deg, #ff0055, #ff5500) !important; 
            color: #ffffff !important; 
            font-size: 14px !important;
            font-weight: 900 !important;
            box-shadow: 0 0 15px #ff0055, 0 0 25px #ff5500 !important;
            transform: scale(1.2);
            z-index: 10;
            border: 2px solid #ffffff !important;
            animation: pulseBright 1s infinite alternate;
        }

        @keyframes pulseBright {
            0% { transform: scale(1.1); box-shadow: 0 0 10px #ff0055; }
            100% { transform: scale(1.25); box-shadow: 0 0 22px #ff5500, 0 0 10px #ffffff; }
        }

        /* CURRENT CALL BIG CIRCLE */
        .current-call-box { background: var(--card-bg); padding: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--primary-cyan); }
        .call-circle { 
            background: linear-gradient(135deg, #ff0055, #ffab00); 
            color: #fff; font-weight: 900; padding: 8px 16px; border-radius: 20px; font-size: 16px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
        }

        .cards-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
        .card-btn { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px 0; border-radius: 4px; font-weight: 800; font-size: 11px; }
        .card-btn.active { background: #10b981 !important; color: #000 !important; }

        .board-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
        .board-cell { background: rgba(0,0,0,0.3); color: #fff; padding: 10px 0; text-align: center; font-weight: 800; border-radius: 4px; }
        .board-cell.marked, .board-cell.free { background: var(--accent-green); }
        
        input, textarea, select { width: 100%; padding: 10px; margin-top: 6px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); color: #fff; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🎲 እድል ቢንጎ</div>
        <div class="balance-badge">💵 <span id="userBalanceDisplay">0.00</span> ETB</div>
    </div>

    <div class="container">
        <div id="gameTab" class="tab-content active">
            <div id="gameStepBet" class="game-step active">
                <div class="card" style="text-align:center;">
                    <h2>እንኳን ወደ እድል ቢንጎ በደህና መጡ!</h2>
                    <p style="color:var(--text-sub); margin-top:6px;">የመጫወቻ ዋጋ ይምረጡ፡</p>
                    <button class="btn" style="margin-top:10px;" onclick="selectBet(20)">20 ብር</button>
                    <button class="btn" style="margin-top:10px;" onclick="selectBet(50)">50 ብር</button>
                </div>
            </div>

            <div id="gameStepCards" class="game-step">
                <div class="cards-grid" id="cardsGrid"></div>
                <button class="btn" style="margin-top:12px;" onclick="goToGame()">ጨዋታውን ጀምር (Join)</button>
            </div>

            <div id="gameStepLive" class="game-step">
                <div class="current-call-box" style="margin-bottom:8px;">
                    <span>አሁን የተጠራው ቁጥር:</span>
                    <div class="call-circle" id="currentCallCircle">-</div>
                </div>

                <div class="card">
                    <div class="called-grid" id="calledGrid"></div>
                </div>

                <div class="card">
                    <div class="board-grid" id="userBoardGrid"></div>
                    <button class="btn" style="margin-top:10px; background: linear-gradient(135deg, #ff2a5f, #e11d48);" onclick="checkPlayerBingo()">🎉 BINGO!</button>
                </div>
            </div>
        </div>

        <div id="walletTab" class="tab-content">
            <div class="card">
                <h3>💳 ብር ገቢ ማድረግ (Deposit)</h3>
                <input type="number" id="depAmount" placeholder="የብር መጠን">
                <textarea id="depSMS" rows="2" placeholder="የቴሌብር SMS ይልጠፉ"></textarea>
                <button class="btn" style="margin-top:8px; background:#10b981;" onclick="submitDeposit()">ገቢ አድርግ</button>
            </div>
            <div class="card">
                <h3>💸 ገንዘብ ማውጣት (Withdraw)</h3>
                <select id="withdrawMethod">
                    <option value="Telebirr">ቴሌብር</option>
                    <option value="CBE">ንግድ ባንክ</option>
                </select>
                <input type="number" id="withdrawAmount" placeholder="የብር መጠን">
                <input type="text" id="withdrawDetails" placeholder="የስልክ/አካውንት ቁጥር">
                <button class="btn" style="margin-top:8px; background:#ff2a5f;" onclick="submitWithdraw()">ወጪ አድርግ</button>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('gameTab', this)">🎮 ጨዋታ</div>
        <div class="nav-item" onclick="switchTab('walletTab', this)">💳 ዋሌት</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const socket = io();

        let currentUser = {
            id: tg.initDataUnsafe?.user ? String(tg.initDataUnsafe.user.id) : "test_user_1",
            first_name: tg.initDataUnsafe?.user ? tg.initDataUnsafe.user.first_name : "Player"
        };

        let userWallet = 0;
        let currentBet = 20;
        let selectedCardId = null;
        let currentRoomId = null;
        let drawnNumbers = [];
        let playerMarked = Array(5).fill(null).map(() => Array(5).fill(false));

        window.addEventListener('DOMContentLoaded', fetchUserData);

        async function fetchUserData() {
            const res = await fetch('/api/get-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: currentUser.id, name: currentUser.first_name })
            });
            const data = await res.json();
            if(data.user) {
                userWallet = parseFloat(data.user.balance);
                document.getElementById('userBalanceDisplay').innerText = userWallet.toFixed(2);
            }
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function selectBet(amt) {
            currentBet = amt;
            document.querySelectorAll('.game-step').forEach(s => s.classList.remove('active'));
            document.getElementById('gameStepCards').classList.add('active');
            socket.emit('joinLobby', { betAmount: amt });
            initCardsGrid();
        }

        socket.on('assignedRoom', (data) => { currentRoomId = data.roomId; });

        function initCardsGrid() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            for(let i=1; i<=100; i++) {
                let btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.innerText = i;
                btn.onclick = () => {
                    selectedCardId = i;
                    document.querySelectorAll('.card-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                grid.appendChild(btn);
            }
        }

        async function goToGame() {
            if(!selectedCardId) return alert('ቦርድ ይምረጡ!');
            
            const res = await fetch('/api/place-bet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: currentUser.id, amount: currentBet })
            });
            const data = await res.json();
            if(!data.success) return alert(data.message);

            socket.emit('startPlayerGame', { roomId: currentRoomId, boardNumber: selectedCardId });
            
            document.querySelectorAll('.game-step').forEach(s => s.classList.remove('active'));
            document.getElementById('gameStepLive').classList.add('active');

            initCalledGrid();
            initBoardGrid();
        }

        function initCalledGrid() {
            const grid = document.getElementById('calledGrid');
            grid.innerHTML = '';
            for(let i=1; i<=75; i++) {
                let div = document.createElement('div');
                div.className = 'grid-num';
                div.id = `num-${i}`;
                div.innerText = i;
                grid.appendChild(div);
            }
        }

        function initBoardGrid() {
            const grid = document.getElementById('userBoardGrid');
            grid.innerHTML = '';
            for(let r=0; r<5; r++) {
                for(let c=0; c<5; c++) {
                    let div = document.createElement('div');
                    div.className = 'board-cell';
                    if(r===2 && c===2) { div.innerText = 'FREE'; div.classList.add('free'); }
                    else { div.innerText = Math.floor(Math.random()*15) + (c*15) + 1; }
                    div.onclick = () => div.classList.toggle('marked');
                    grid.appendChild(div);
                }
            }
        }

        /* 🌟 ቁጥር ሲጠራ CURRENT CALL ደምቆ፣ ያለፉት ደብዝዘው እንዲታዩ የሚያደርገው ክፍል */
        socket.on('numberDrawn', (data) => {
            let rand = data.number;
            drawnNumbers = data.drawnHistory;
            document.getElementById('currentCallCircle').innerText = rand;

            // 1. ሁሉንም ቁጥሮች ከደማቁ ስታይል (latest-call) ነፃ ማድረግ
            document.querySelectorAll('.grid-num').forEach(el => el.classList.remove('latest-call'));

            // 2. ያለፉትን ቁጥሮች በሙሉ። ደበዝ (called) ማድረግ
            drawnNumbers.forEach(n => {
                let cell = document.getElementById(`num-${n}`);
                if(cell) cell.classList.add('called');
            });

            // 3. አሁን የተጠራችዋን ቁጥር ብቻ በጣም ደማቅ (latest-call) ማድረግ
            let currentCell = document.getElementById(`num-${rand}`);
            if(currentCell) {
                currentCell.classList.add('called', 'latest-call');
            }
        });

        socket.on('gameOver', (data) => {
            alert(`🎉 ጨዋታው ተጠናቋል! አሸናፊ፡ ${data.winnerName || 'ቦት'}`);
            location.reload();
        });

        async function submitDeposit() {
            const amount = document.getElementById('depAmount').value;
            const sms = document.getElementById('depSMS').value;
            if(!amount || !sms) return alert('መረጃዎቹን ይሙሉ!');

            const res = await fetch('/api/request-transaction', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: currentUser.id, type: 'DEPOSIT', amount, sms })
            });
            const data = await res.json();
            if(data.success) alert('የዲፖዚት ጥያቄዎ ተልኳል!');
        }

        async function submitWithdraw() {
            const amount = document.getElementById('withdrawAmount').value;
            const details = document.getElementById('withdrawDetails').value;
            if(!amount || !details) return alert('መረጃዎቹን ይሙሉ!');

            const res = await fetch('/api/request-transaction', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: currentUser.id, type: 'WITHDRAW', amount, details })
            });
            const data = await res.json();
            if(data.success) alert('የወጪ ጥያቄዎ ተልኳል!');
        }
    </script>
</body>
</html>
