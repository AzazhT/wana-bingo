<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wana Bingo Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(22, 30, 49, 0.75);
            --card-border: rgba(255, 255, 255, 0.15);
            --primary-cyan: #00f2fe;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #ff2a5f;
            --accent-purple: #a855f7;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #070a12; color: var(--text-main); padding-bottom: 65px; min-height: 100vh; }
        .header { background: rgba(15, 23, 42, 0.85); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header.hidden { display: none !important; }
        .logo { font-size: 18px; font-weight: 900; color: #00f2fe; }
        .balance-badge { background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; color: var(--accent-green); font-weight: 800; font-size: 13px; }
        .container { padding: 8px; max-width: 500px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .game-step { display: none; }
        .game-step.active { display: block; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--card-border); }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 10px; width: 100%; font-size: 15px; cursor: pointer; font-weight: 800; }
        .bet-selection-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .bet-grid-btn { padding: 16px; font-size: 18px; font-weight: 800; background: var(--card-bg); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; cursor: pointer; width: 100%; text-align: center; }
        .cards-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 10px; }
        .card-btn { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 6px 0; border-radius: 4px; font-weight: 800; font-size: 11px; cursor: pointer; }
        .card-btn.active { background: #10b981 !important; color: #000; }
        .card-btn.taken { background: #ff003c !important; opacity: 0.9; cursor: not-allowed; }
        .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; border-top: 1px solid var(--card-border); }
        .nav-item { color: var(--text-sub); font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary-cyan); }
    </style>
</head>
<body>

    <div class="header" id="mainHeader">
        <div class="logo">🎲 Wana Bingo</div>
        <div class="balance-badge">💵 <span id="userBalanceDisplay">0.00</span> ETB</div>
    </div>

    <div class="container">
        <div id="gameTab" class="tab-content active">
            <div id="gameStepBet" class="game-step active">
                <div style="text-align: center; padding: 16px 0;">
                    <h2>እንኳን ወደ Wana Bingo በደህና መጡ!</h2>
                    <p>ለመጀመር የሚፈልጉትን የጨዋታ ዋጋ ይምረጡ፡</p>
                </div>
                <div class="bet-selection-grid">
                    <button class="bet-grid-btn" onclick="selectBet(20)">20 ብር</button>
                    <button class="bet-grid-btn" onclick="selectBet(50)">50 ብር</button>
                    <button class="bet-grid-btn" onclick="selectBet(100)">100 ብር</button>
                </div>
            </div>

            <div id="gameStepCards" class="game-step">
                <div class="cards-grid" id="cardsGrid"></div>
                <button class="btn" style="margin-top: 12px;" onclick="goToGame()">ጨዋታውን ተቀላቀል (Join)</button>
            </div>

            <div id="gameStepLive" class="game-step">
                <h3 style="text-align:center; color: var(--accent-amber);">ጨዋታው በሂደት ላይ ነው...</h3>
                <div id="countdownText" style="text-align:center; font-size: 20px; margin-top: 10px;">30s</div>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('gameTab', this)">ጨዋታ</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const socket = io();
        let currentUser = { id: "user_" + Math.floor(Math.random()*1000), first_name: "Player" };
        let currentBet = 20;
        let selectedCardId = null;
        let currentRoomId = null;

        function autoClearAndRedirect(msg) {
            selectedCardId = null;
            alert(msg || 'ጨዋታው ተጀምሯል! መግባት አይቻልም።');
            showGameStep('gameStepBet');
        }

        socket.on('gameAlreadyStarted', (data) => {
            autoClearAndRedirect(data.message);
        });

        socket.on('assignedRoom', (data) => {
            currentRoomId = data.roomId;
            if(data.status === 'playing') {
                autoClearAndRedirect('ጨዋታው ተጀምሯል! መግባት አይቻልም።');
            }
        });

        function showGameStep(stepId) {
            document.querySelectorAll('.game-step').forEach(s => s.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
            const header = document.getElementById('mainHeader');
            if (stepId === 'gameStepBet') header.classList.remove('hidden');
            else header.classList.add('hidden');
        }

        function selectBet(amount) {
            currentBet = amount;
            selectedCardId = null;
            showGameStep('gameStepCards');
            initCards();
            socket.emit('joinLobby', { betAmount: amount });
        }

        function initCards() {
            const cardsGrid = document.getElementById('cardsGrid');
            cardsGrid.innerHTML = '';
            for(let i = 1; i <= 100; i++) {
                const btn = document.createElement('button');
                btn.className = `card-btn`;
                btn.id = `card-btn-${i}`;
                btn.innerText = i;
                btn.onclick = () => {
                    selectedCardId = i;
                    document.querySelectorAll('.card-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                cardsGrid.appendChild(btn);
            }
        }

        function goToGame() {
            if (selectedCardId === null) return alert('እባክዎ ቦርድ ይምረጡ!');
            socket.emit('startPlayerGame', { roomId: currentRoomId, boardNumber: selectedCardId, name: currentUser.first_name });
            showGameStep('gameStepLive');
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
