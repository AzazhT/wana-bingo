<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እድል Bingo Pro - የሀይሉ ሾው (Tactical)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(22, 30, 49, 0.75);
            --card-border: rgba(255, 255, 255, 0.15);
            --primary-cyan: #00f2fe;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #ff2a5f;
            --accent-purple: #a855f7;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: radial-gradient(circle at top, #111827 0%, #070a12 100%); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; }

        .header { background: rgba(15, 23, 42, 0.85); padding: 10px 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 18px; font-weight: 900; background: linear-gradient(135deg, #00f2fe, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .balance-badge { background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; font-weight: 800; color: var(--accent-green); font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3); }

        .container { padding: 8px; max-width: 500px; margin: 0 auto; }
        .tab-content, .game-step { display: none; }
        .tab-content.active, .game-step.active { display: block; }

        .bet-selection-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .bet-grid-btn { padding: 16px; font-size: 18px; font-weight: 800; background: var(--card-bg); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; cursor: pointer; }

        .top-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub); padding: 6px 2px; border-radius: 8px; text-align: center; font-size: 9px; font-weight: 800; }
        .stat-card span { display: block; font-size: 11px; color: #fff; margin-top: 2px; font-weight: 900; }

        .cards-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; background: rgba(0, 0, 0, 0.5); padding: 6px; border-radius: 10px; }
        .card-btn { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.4); padding: 6px 0; border-radius: 4px; font-weight: 800; font-size: 11px; cursor: pointer; }
        .card-btn.active { background: linear-gradient(135deg, #00ff87, #10b981) !important; color: #000 !important; }
        .card-btn.taken { background: linear-gradient(135deg, #ff003c, #cc0000) !important; cursor: not-allowed; opacity: 0.9; }

        .game-layout { display: flex; gap: 8px; height: calc(100vh - 200px); min-height: 420px; }
        .called-grid-container { background: var(--card-bg); padding: 8px; border-radius: 12px; width: 48%; border: 1px solid var(--card-border); display: flex; flex-direction: column; }
        .bingo-header-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-bottom: 6px; text-align: center; font-weight: 900; font-size: 11px; }
        .b-header { background: var(--accent-amber); color: #000; border-radius: 4px; }
        .i-header { background: var(--accent-green); color: #fff; border-radius: 4px; }
        .n-header { background: #0284c7; color: #fff; border-radius: 4px; }
        .g-header { background: var(--accent-rose); color: #fff; border-radius: 4px; }
        .o-header { background: var(--accent-purple); color: #fff; border-radius: 4px; }

        .called-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; flex: 1; overflow-y: auto; }
        .grid-num { background: rgba(0, 0, 0, 0.4); color: var(--text-sub); font-size: 12px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 800; }
        .grid-num.called { background: rgba(180, 40, 60, 0.4) !important; color: #d1d5db !important; }
        .grid-num.called.latest-call { background: linear-gradient(135deg, #f59e0b, #d97706) !important; color: #000 !important; font-weight: 900 !important; border: 2px solid #fff; }

        .right-panel { width: 52%; display: flex; flex-direction: column; gap: 6px; }
        .user-board { background: var(--card-bg); padding: 8px; border-radius: 12px; border: 1px solid var(--card-border); flex: 1; display: flex; flex-direction: column; }
        .board-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; flex: 1; margin-top: 6px; }
        .board-cell { background: rgba(0,0,0,0.3); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; border: 1px solid var(--card-border); }
        .board-cell.free, .board-cell.marked { background: var(--accent-green); color: white; }

        .btn-bingo-small { background: linear-gradient(135deg, #ff2a5f, #e11d48); font-size: 16px; padding: 12px; border-radius: 12px; cursor: pointer; color: #fff; font-weight: 900; border: none; width: 100%; margin-top: 8px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { background: #1e1b4b; width: 90%; max-width: 360px; padding: 20px; border-radius: 20px; text-align: center; border: 1px solid var(--accent-purple); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🎲 <span>እድል Bingo (Tactical)</span></div>
        <div class="balance-badge">💵 <span id="userBalanceDisplay">0.00</span> ETB</div>
    </div>

    <div class="container">
        <div id="gameStepBet" class="game-step active">
            <h2 style="text-align:center; color: var(--accent-amber); margin: 15px 0;">የጨዋታ ክፍያ ይምረጡ</h2>
            <div class="bet-selection-grid">
                <button class="bet-grid-btn" onclick="selectBet(20)">20 ብር</button>
                <button class="bet-grid-btn" onclick="selectBet(50)">50 ብር</button>
                <button class="bet-grid-btn" onclick="selectBet(100)">100 ብር</button>
            </div>
        </div>

        <div id="gameStepCards" class="game-step">
            <h3 style="margin-bottom: 8px;">ካርድ ይምረጡ</h3>
            <div class="cards-grid" id="cardsGrid"></div>
            <button class="btn-bingo-small" style="background: linear-gradient(135deg, #00f2fe, #0284c7);" onclick="goToGame()">ተጫወት (Join)</button>
        </div>

        <div id="gameStepLive" class="game-step">
            <div class="top-stats">
                <div class="stat-card">Room<span id="gameIdDisplay">--</span></div>
                <div class="stat-card">Derash<span id="derashDisplay" style="color: var(--accent-green);">0.0</span></div>
                <div class="stat-card">Active<span id="activePlayersDisplayLive">0</span></div>
                <div class="stat-card">Call<span id="callCount" style="color: var(--accent-amber);">0</span></div>
            </div>

            <div class="game-layout">
                <div class="called-grid-container">
                    <div class="bingo-header-row">
                        <div class="b-header">B</div><div class="i-header">I</div><div class="n-header">N</div><div class="g-header">G</div><div class="o-header">O</div>
                    </div>
                    <div class="called-grid" id="calledGrid"></div>
                </div>

                <div class="right-panel">
                    <div style="background: var(--card-bg); padding: 8px; border-radius: 8px; font-weight:800; font-size:11px; text-align:center;">
                        የተጠራው: <span id="currentCallCircle" style="color:var(--accent-amber); font-size:14px;">-</span>
                    </div>

                    <div class="user-board">
                        <div class="bingo-header-row">
                            <div class="b-header">B</div><div class="i-header">I</div><div class="n-header">N</div><div class="g-header">G</div><div class="o-header">O</div>
                        </div>
                        <div class="board-grid" id="userBoardGrid"></div>
                    </div>
                </div>
            </div>

            <button class="btn-bingo-small" onclick="checkPlayerBingo()">🎉 BINGO!</button>
        </div>
    </div>

    <div class="modal-overlay" id="winnerModal">
        <div class="modal-card">
            <h1 style="color: var(--accent-amber);">🎉 BINGO! 🎉</h1>
            <p id="winnerSubText" style="margin: 10px 0; font-weight: 800;"></p>
            <p id="modalPrizeText" style="color: var(--accent-green); font-size: 18px; font-weight: 900;"></p>
            <button class="btn-bingo-small" onclick="location.reload()">እሺ (Play Again)</button>
        </div>
    </div>

    <script>
        const socket = io();
        let userWallet = 100.00;
        let currentBet = 20;
        let selectedCardId = null;
        let currentRoomId = null;
        let drawnNumbers = [];
        let playerMarkedBoard = Array(5).fill(null).map(() => Array(5).fill(false));
        let allCardsData = {};
        let roomSelectedBoards = {};

        function showStep(id) {
            document.querySelectorAll('.game-step').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectBet(amount) {
            currentBet = amount;
            showStep('gameStepCards');
            initPageCards();
            socket.emit('joinLobby', { betAmount: amount });
        }

        function generateBingoCard() {
            let ranges = [[1,15], [16,30], [31,45], [46,60], [61,75]];
            let cols = [];
            for(let c = 0; c < 5; c++) {
                let col = [];
                let min = ranges[c][0], max = ranges[c][1];
                while(col.length < 5) {
                    let rand = Math.floor(Math.random() * (max - min + 1)) + min;
                    if(!col.includes(rand)) col.push(rand);
                }
                cols.push(col);
            }
            let card = [];
            for(let r = 0; r < 5; r++) {
                let row = [];
                for(let c = 0; c < 5; c++) {
                    row.push(r === 2 && c === 2 ? "*" : cols[c][r]);
                }
                card.push(row);
            }
            return card;
        }

        function initPageCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            for(let i = 1; i <= 100; i++) {
                if(!allCardsData[i]) allCardsData[i] = generateBingoCard();
                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.id = `card-btn-${i}`;
                btn.innerText = i;
                btn.onclick = () => {
                    selectedCardId = i;
                    updateCardsUI();
                };
                grid.appendChild(btn);
            }
        }

        function updateCardsUI() {
            for(let i = 1; i <= 100; i++) {
                const btn = document.getElementById(`card-btn-${i}`);
                if(btn) {
                    btn.classList.remove('active', 'taken');
                    if(roomSelectedBoards[i]) btn.classList.add('taken');
                    else if(selectedCardId === i) btn.classList.add('active');
                }
            }
        }

        socket.on('assignedRoom', (data) => {
            currentRoomId = data.roomId;
            document.getElementById('gameIdDisplay').innerText = currentRoomId;
            roomSelectedBoards = data.selectedBoards || {};
            updateCardsUI();
        });

        socket.on('numberDrawn', (data) => {
            drawnNumbers = data.drawnHistory || [];
            document.getElementById('callCount').innerText = drawnNumbers.length;
            document.getElementById('currentCallCircle').innerText = data.number;

            document.querySelectorAll('.grid-num').forEach(el => el.classList.remove('latest-call'));
            drawnNumbers.forEach(n => {
                let cell = document.getElementById(`grid-num-${n}`);
                if (cell) cell.classList.add('called');
            });

            let latestCell = document.getElementById(`grid-num-${data.number}`);
            if (latestCell) latestCell.classList.add('called', 'latest-call');
        });

        socket.on('gameOver', (data) => {
            document.getElementById('winnerSubText').innerText = `${data.winnerName} አሸንፏል! (ቦርድ #${data.boardNumber})`;
            document.getElementById('modalPrizeText').innerText = `ሽልማት: ${data.winAmount} ETB`;
            document.getElementById('winnerModal').style.display = 'flex';
        });

        function goToGame() {
            if(!selectedCardId) return alert("እባክዎን ቦርድ ይምረጡ!");
            showStep('gameStepLive');

            // 15x5 Grid Tactical Setup (B, I, N, G, O)
            const calledGrid = document.getElementById('calledGrid');
            calledGrid.innerHTML = '';
            for (let row = 0; row < 15; row++) {
                for (let col = 0; col < 5; col++) {
                    let num = (col * 15) + (row + 1);
                    let cell = document.createElement('div');
                    cell.className = 'grid-num';
                    cell.id = `grid-num-${num}`;
                    cell.innerText = num;
                    calledGrid.appendChild(cell);
                }
            }

            // Render Player Board
            const boardGrid = document.getElementById('userBoardGrid');
            boardGrid.innerHTML = '';
            playerMarkedBoard = Array(5).fill(null).map(() => Array(5).fill(false));
            playerMarkedBoard[2][2] = true;

            allCardsData[selectedCardId].forEach((row, r) => {
                row.forEach((val, c) => {
                    let cell = document.createElement('div');
                    cell.className = `board-cell ${val === '*' ? 'free' : ''}`;
                    cell.innerText = val;
                    cell.onclick = () => {
                        if(val !== '*') {
                            playerMarkedBoard[r][c] = !playerMarkedBoard[r][c];
                            cell.classList.toggle('marked');
                        }
                    };
                    boardGrid.appendChild(cell);
                });
            });

            socket.emit('startPlayerGame', { roomId: currentRoomId, boardNumber: selectedCardId, name: "ተጫዋች" });
        }

        function checkPlayerBingo() {
            const card = allCardsData[selectedCardId];
            let hasWon = false;
            
            const isValid = (r, c) => (card[r][c] === '*' || drawnNumbers.includes(card[r][c])) && playerMarkedBoard[r][c];

            // Rows, Columns, Diagonals check
            for(let i=0; i<5; i++) {
                if([0,1,2,3,4].every(c => isValid(i, c))) hasWon = true;
                if([0,1,2,3,4].every(r => isValid(r, i))) hasWon = true;
            }
            if([0,1,2,3,4].every(i => isValid(i, i))) hasWon = true;
            if([0,1,2,3,4].every(i => isValid(i, 4-i))) hasWon = true;

            if(hasWon) {
                socket.emit('claimBingo', { name: "ተጫዋች", roomId: currentRoomId, boardNumber: selectedCardId });
            } else {
                alert("ገና አልሞላም! ቁጥሮችን በትክክል ያረጋግጡ።");
            }
        }
    </script>
</body>
</html>
