<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቢንጎ ጨዋታ ሎቢ</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
        #notification-bar { background-color: #ffcc00; color: #333; padding: 10px; font-weight: bold; display: none; margin-bottom: 15px; border-radius: 5px; }
        .board-container { margin: 20px auto; padding: 15px; background: white; width: 350px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
        .cell { padding: 12px; background: #e0e0e0; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .cell.selected { background: #4CAF50; color: white; cursor: not-allowed; }
        .cell.clearing { background: #ff5722; color: white; }
    </style>
</head>
<body>

    <h1>የቢንጎ ባለብዙ ራውንድ ጨዋታ</h1>
    
    <!-- ኖቲፊኬሽን ማሳያ (ለምሳሌ: ጨዋታ በሂደት ላይ ሲሆን) -->
    <div id="notification-bar"></div>

    <div class="board-container">
        <h3 id="round-title">ራውንድ በመጫን ላይ...</h3>
        <p>ቆጠራ: <span id="timer">30</span> ሰከንድ</p>
        <div class="grid" id="number-board"></div>
    </div>

    <!-- Socket.io ከሰርቨር ጋር ማገናኛ -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const notificationBar = document.getElementById('notification-bar');
        const roundTitle = document.getElementById('round-title');
        const timerSpan = document.getElementById('timer');
        const numberBoard = document.getElementById('number-board');

        let currentRoundId = null;

        // ጨዋታውን መቀላቀል
        socket.emit('joinGame');

        // የቦጥር ሰሌዳ ማዘጋጀት (ከ 1 እስከ 25 ቁጥሮች)
        function createBoard(selectedNumbers = {}) {
            numberBoard.innerHTML = '';
            for (let i = 1; i <= 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.textContent = i;
                cell.id = `cell-${i}`;

                if (selectedNumbers[i]) {
                    cell.classList.add('selected');
                }

                cell.addEventListener('click', () => {
                    if (currentRoundId && !cell.classList.contains('selected')) {
                        socket.emit('selectNumber', { roundId: currentRoundId, number: i });
                    }
                });

                numberBoard.appendChild(cell);
            }
        }

        // ራውንድ ሲሳካና መረጃ ሲመጣ
        socket.on('joinedRound', (data) => {
            currentRoundId = data.roundId;
            roundTitle.textContent = `ራውንድ ${data.roundId} (ምርጫ ክፍት ነው)`;
            timerSpan.textContent = data.timer;
            notificationBar.style.display = 'none';
            createBoard(data.selectedNumbers);
        });

        // አዲስ ራውንድ ሲከፈት
        socket.on('newRoundOpened', (data) => {
            console.log(`አዲስ ራውንድ ተከፍቷል: ${data.roundId}`);
        });

        // የሰከንድ ቆጠራ ማሻሻያ
        socket.on('timerUpdate', (data) => {
            if (data.roundId === currentRoundId) {
                timerSpan.textContent = data.timer;
            }
        });

        // ቁጥር ሲመረጥ
        socket.on('numberSelected', (data) => {
            if (data.roundId === currentRoundId) {
                const cell = document.getElementById(`cell-${data.number}`);
                if (cell) {
                    cell.classList.add('selected');
                }
            }
        });

        // 30 ሰከንድ አልቆ ጨዋታው ሲጀመር
        socket.on('gameStarted', (data) => {
            if (data.roundId === currentRoundId) {
                roundTitle.textContent = `ራውንድ ${data.roundId} (ጨዋታው ተጀምሯል!)`;
            }
        });

        // ራውንድ አልቆ ቦርዱ ለ 3 ሰከንድ Clear ሲደረግ
        socket.on('roundClearing', (data) => {
            if (data.roundId === currentRoundId) {
                notificationBar.style.display = 'block';
                notificationBar.textContent = data.message;
                
                // ቦርዱን በሰአቱ ማጽዳት/Clearing ማድረግ
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => {
                    cell.classList.remove('selected');
                    cell.classList.add('clearing');
                });
            }
        });

        // የ 3 ሰከንዱ Clear ሂደት አብቅቶ ቦርዱ ሙሉ በሙሉ ሲጸዳ
        socket.on('boardCleared', (data) => {
            if (data.roundId === currentRoundId) {
                // ተጠቃሚው ወደ ቀጣዩ ክፍት ራውንድ በራስ-ሰር እንዲገባ መጠየቅ
                socket.emit('joinGame');
            }
        });

        // ሶስቱም ራውንዶች ሞልተው ሲገኙ የሚመጣ ማሳሰቢያ
        socket.on('gameNotification', (data) => {
            if (data.type === 'BUSY') {
                notificationBar.style.display = 'block';
                notificationBar.textContent = data.message; // "ጨዋታ እየተካሄደ ነው፣ እባክዎ ትንሽ ይጠብቁ"
            }
        });
    </script>
</body>
</html>
