<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዋና ቢንጎ ጨዋታ (Wana Bingo)</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --secondary-color: #3182ce;
            --accent-color: #48bb78;
            --danger-color: #e53e3e;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .user-info h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .balance-badge {
            background: #ebf8ff;
            color: var(--secondary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            border: 1px solid #bee3f8;
        }

        /* Lobby & Timer Section */
        .lobby-box {
            background: #fffaf0;
            border: 1px solid #feebc8;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .lobby-box h3 {
            margin: 0 0 5px 0;
            color: #dd6b20;
            font-size: 1rem;
        }

        .timer-display {
            font-size: 1.4rem;
            font-weight: bold;
            color: #c05621;
        }

        /* Number Calling Board */
        .call-board {
            text-align: center;
            background: #ebf8ff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .current-number {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2b6cb0;
        }

        /* Bingo Card Design */
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }

        .bingo-header {
            background: var(--primary-color);
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 8px 0;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .cell {
            background: #edf2f7;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            user-select: none;
        }

        .cell.marked {
            background: var(--accent-color) !important;
            color: white;
        }

        .cell.free {
            background: #cbd5e0;
            font-size: 0.75rem;
        }

        /* Action Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:active {
            background: var(--secondary-color);
        }

        .btn-success {
            background: var(--accent-color);
            color: white;
        }

        .wallet-actions {
            display: flex;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Info -->
        <header>
            <div class="user-info">
                <h2 id="username-display">ጫዋች...</h2>
                <small id="user-id-display" style="color: #718096;"></small>
            </div>
            <div class="balance-badge">
                <span id="balance-display">0.00</span> ETB
            </div>
        </header>

        <!-- Lobby & Countdown Box -->
        <div id="lobby-section" class="lobby-box">
            <h3 id="round-title">ክፍለ ጊዜ (Round Loining)</h3>
            <div class="timer-display" id="timer">30 ሰከንድ ቀርቷል</div>
            <p id="lobby-status-text" style="margin: 5px 0 0 0; font-size: 0.85rem; color: #718096;">ተጫዋቾች በመጠባበቅ ላይ ይገኛሉ...</p>
        </div>

        <!-- Active Game Calling Board -->
        <div id="game-board-section" class="call-board hidden">
            <div style="font-size: 0.85rem; color: #4a5568;">የወጣ ቁጥር (Current Call):</div>
            <div class="current-number" id="current-drawn-num">--</div>
            <div style="font-size: 0.8rem; color: #718096; margin-top: 5px;" id="drawn-history">ወጡ: የሉም</div>
        </div>

        <!-- Bingo Card Grid -->
        <div class="bingo-card" id="bingo-card-grid">
            <!-- Dynamically generated via JS -->
        </div>

        <!-- Bingo Claim Button -->
        <button id="bingo-btn" class="btn btn-success hidden">🎉 ቢንጎ አሸነፍኩ (Claim Bingo)!</button>

        <!-- Wallet Actions / Transaction Form -->
        <div style="margin-top: 15px; border-top: 1px solid #edf2f7; padding-top: 15px;">
            <h4 style="margin: 0 0 10px 0; font-size: 0.95rem;">ገንዘብ ማስገባት / ማውጣት</h4>
            <input type="number" id="tx-amount" placeholder="የብር መጠን (ETB)">
            <input type="text" id="tx-details" placeholder="የባንክ/ቴሌብር ትራንዛክሽን ማረጋገጫ (SMS/Ref)">
            <div class="wallet-actions">
                <button class="btn btn-primary" onclick="requestTx('DEPOSIT')">ዲፖዚት (Deposit)</button>
                <button class="btn btn-primary" style="background-color: #dd6b20;" onclick="requestTx('WITHDRAW')">ዊዝድሮው (Withdraw)</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let currentRoundId = null;
        let userCardNumbers = [];

        // Telegram WebApp Integration
        const tg = window.Telegram.WebApp;
        tg.expand();

        const telegramUser = tg.initDataUnsafe?.user;
        const identifier = telegramUser ? telegramUser.id.toString() : "test_user_" + Math.floor(Math.random() * 1000);
        const firstName = telegramUser ? telegramUser.first_name : "Bingo Guest";
        const username = telegramUser ? telegramUser.username : "";

        // Fetch User Data from Server & Database
        async function initUser() {
            try {
                const res = await fetch('/api/get-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, name: firstName, username })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    document.getElementById('username-display').innerText = currentUser.name;
                    document.getElementById('user-id-display').innerText = `ID: ${currentUser.identifier}`;
                    document.getElementById('balance-display').innerText = parseFloat(currentUser.balance).toFixed(2);
                }
            } catch (e) {
                console.error("User init error:", e);
            }
        }

        // Generate Random Bingo Card Numbers (5x5)
        function generateBingoCard() {
            const grid = document.getElementById('bingo-card-grid');
            grid.innerHTML = '';
            
            const headers = ['B', 'I', 'N', 'G', 'O'];
            headers.forEach(h => {
                const hDiv = document.createElement('div');
                hDiv.className = 'bingo-header';
                hDiv.innerText = h;
                grid.appendChild(hDiv);
            });

            // Generate random numbers for card
            userCardNumbers = [];
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if (i === 12) {
                    cell.innerText = 'FREE';
                    cell.className = 'cell free marked';
                    userCardNumbers.push('FREE');
                } else {
                    let randNum = Math.floor(Math.random() * 75) + 1;
                    cell.innerText = randNum;
                    userCardNumbers.push(randNum);
                    cell.onclick = () => {
                        cell.classList.toggle('marked');
                    };
                }
                grid.appendChild(cell);
            }
        }

        // --- Socket.io Handlers for Independent Rounds ---
        socket.emit('joinActiveLobby');

        socket.on('joinedRoom', (data) => {
            currentRoundId = data.roundId;
            document.getElementById('round-title').innerText = `ክፍለ ጊዜ (Round ${currentRoundId})`;
            if (data.status === 'PLAYING') {
                document.getElementById('lobby-section').classList.add('hidden');
                document.getElementById('game-board-section').classList.remove('hidden');
                document.getElementById('bingo-btn').classList.remove('hidden');
            }
        });

        socket.on('timerUpdate', (data) => {
            if (data.roundId === currentRoundId) {
                document.getElementById('timer').innerText = `${data.timeLeft} ሰከንድ ቀርቷል`;
            }
        });

        socket.on('gameStarted', (data) => {
            if (data.roundId === currentRoundId) {
                alert(data.message);
                document.getElementById('lobby-section').classList.add('hidden');
                document.getElementById('game-board-section').classList.remove('hidden');
                document.getElementById('bingo-btn').classList.remove('hidden');
            }
        });

        socket.on('numberDrawn', (data) => {
            if (data.roundId === currentRoundId) {
                document.getElementById('current-drawn-num').innerText = data.number;
                document.getElementById('drawn-history').innerText = `ወጡ (${data.drawnHistory.length}): ${data.drawnHistory.slice(-5).join(', ')}`;
            }
        });

        socket.on('gameOver', (data) => {
            alert(data.message);
            location.reload(); // Refresh to join new round lobby
        });

        // Claim Bingo Button Action
        document.getElementById('bingo-btn').onclick = () => {
            socket.emit('claimBingo', {
                identifier: currentUser.identifier,
                winAmount: 50.00, // የሽልማት መጠን
                roundId: currentRoundId
            });
        };

        // Transaction Request (Deposit / Withdraw)
        async function requestTx(type) {
            const amount = document.getElementById('tx-amount').value;
            const details = document.getElementById('tx-details').value;

            if (!amount || amount <= 0) {
                return alert('እባክዎ ትክክለኛ የብር መጠን ያስገቡ!');
            }

            try {
                const res = await fetch('/api/request-transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: currentUser.identifier, type, amount, details })
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) {
                    document.getElementById('tx-amount').value = '';
                    document.getElementById('tx-details').value = '';
                }
            } catch (e) {
                alert('ስህተት ተፈጥሯል፣ እባክዎ እንደገና ይሞክሩ።');
            }
        }

        // Initialize on load
        initUser();
        generateBingoCard();
    </script>
</body>
</html>
