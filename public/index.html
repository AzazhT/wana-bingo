<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wana Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #18222d; color: #ffffff; padding-bottom: 70px; }
        .header { background: #242f3d; padding: 15px; text-align: center; border-bottom: 2px solid #0088cc; display: flex; justify-content: space-between; align-items: center; }
        .balance-badge { background: #2b5278; padding: 6px 12px; border-radius: 20px; font-weight: bold; color: #40b3e0; }
        .container { padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Navigation Bar */
        .navbar { position: fixed; bottom: 0; width: 100%; background: #242f3d; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #10171e; }
        .nav-item { color: #7f91a4; text-decoration: none; font-size: 12px; text-align: center; cursor: pointer; }
        .nav-item.active { color: #64b5ef; font-weight: bold; }
        
        /* Cards & Buttons */
        .card { background: #242f3d; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .btn { background: #0088cc; color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:disabled { background: #555; }
        input { width: 100%; padding: 12px; margin-top: 8px; background: #18222d; border: 1px solid #3b4e62; color: #fff; border-radius: 8px; }
        
        /* Bingo Display */
        .drawn-number { font-size: 48px; font-weight: bold; color: #ffca28; text-align: center; margin: 15px 0; }
        .history-box { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
        .num-ball { width: 32px; height: 32px; background: #3b4e62; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div>🎰 <b>Wana Bingo</b></div>
        <div class="balance-badge">💵 <span id="userBalance">0.00</span> ETB</div>
    </div>

    <div class="container">
        <!-- 🎮 Game Tab -->
        <div id="gameTab" class="tab-content active">
            <div class="card" style="text-align: center;">
                <h3>የወጣው ቁጥር</h3>
                <div class="drawn-number" id="currentNumber">--</div>
                <button id="startBtn" class="btn" onclick="startGame()">🎲 ጨዋታ ጀምር</button>
            </div>

            <div class="card">
                <h4>የወጡ ቁጥሮች ታሪክ</h4>
                <div class="history-box" id="historyBox"></div>
            </div>
        </div>

        <!-- 💳 Wallet Tab -->
        <div id="walletTab" class="tab-content">
            <div class="card">
                <h3>💳 ብር ገቢ ማድረግ (Deposit)</h3>
                <p style="font-size: 13px; color: #aaa; margin-top: 5px;">Telebirr Number: <b>0915503379</b></p>
                <input type="number" id="depAmount" placeholder="የብር መጠን (ETB)">
                <input type="text" id="depDetails" placeholder="የቴሌብር Transaction ID / SMS">
                <button class="btn" onclick="submitTransaction('DEPOSIT')">ገቢ አድርግ</button>
            </div>

            <div class="card">
                <h3>💸 ብር ወጪ ማድረግ (Withdraw)</h3>
                <input type="number" id="withAmount" placeholder="የብር መጠን (ETB)">
                <input type="text" id="withDetails" placeholder="የቴሌብር ስልክ ቁጥርዎ">
                <button class="btn" style="background: #e53935;" onclick="submitTransaction('WITHDRAW')">ወጪ አድርግ</button>
            </div>
        </div>

        <!-- 👤 Profile Tab -->
        <div id="profileTab" class="tab-content">
            <div class="card">
                <h3>👤 የተጫዋች መረጃ</h3>
                <p style="margin-top: 10px;">ስም: <b id="profName">--</b></p>
                <p style="margin-top: 5px;">ID: <b id="profId">--</b></p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('gameTab', this)">🎮<br>ጨዋታ</div>
        <div class="nav-item" onclick="switchTab('walletTab', this)">💳<br>ዋሌት</div>
        <div class="nav-item" onclick="switchTab('profileTab', this)">👤<br>ፕሮፋይል</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const socket = io();
        let currentUser = null;

        // Telegram User Fetch
        const user = tg.initDataUnsafe?.user || { id: "686733543", first_name: "Test User", username: "test" };

        async function fetchUser() {
            try {
                const res = await fetch('/api/get-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: String(user.id),
                        name: user.first_name,
                        username: user.username
                    })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    document.getElementById('userBalance').innerText = parseFloat(currentUser.balance).toFixed(2);
                    document.getElementById('profName').innerText = currentUser.name;
                    document.getElementById('profId').innerText = currentUser.identifier;
                }
            } catch (e) { console.error(e); }
        }
        fetchUser();

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        async function submitTransaction(type) {
            const amount = type === 'DEPOSIT' ? document.getElementById('depAmount').value : document.getElementById('withAmount').value;
            const details = type === 'DEPOSIT' ? document.getElementById('depDetails').value : document.getElementById('withDetails').value;

            if (!amount || !details) return alert('እባክዎን መረጃዎቹን በትክክል ይሙሉ');

            const res = await fetch('/api/request-transaction', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: String(user.id), type, amount, details })
            });

            const data = await res.json();
            alert(data.message);
            if (data.success) {
                fetchUser();
                if (type === 'DEPOSIT') { document.getElementById('depAmount').value = ''; document.getElementById('depDetails').value = ''; }
                else { document.getElementById('withAmount').value = ''; document.getElementById('withDetails').value = ''; }
            }
        }

        // Bingo Socket Events
        socket.on('numberDrawn', data => {
            document.getElementById('currentNumber').innerText = data.number;
            const box = document.getElementById('historyBox');
            box.innerHTML = data.drawnHistory.map(n => `<div class="num-ball">${n}</div>`).join('');
        });

        function startGame() {
            socket.emit('startGame');
        }
    </script>
</body>
</html>
