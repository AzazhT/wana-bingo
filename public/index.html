<style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(22, 30, 49, 0.75);
            --card-border: rgba(255, 255, 255, 0.15);
            --primary-cyan: #00f2fe;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #ff2a5f;
            --accent-purple: #a855f7;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top, #111827 0%, #070a12 100%); 
            color: var(--text-main); 
            padding-bottom: 65px; 
            user-select: none; 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .falling-numbers-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.12;
        }
        .falling-num {
            position: absolute;
            top: -50px;
            color: var(--primary-cyan);
            font-weight: 900;
            font-size: 16px;
            animation: fallDown linear infinite;
        }
        @keyframes fallDown {
            0% { transform: translateY(-50px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255, 42, 95, 0.4); }
            50% { box-shadow: 0 0 25px rgba(255, 42, 95, 0.9), 0 0 10px rgba(255, 255, 255, 0.8); }
            100% { box-shadow: 0 0 10px rgba(255, 42, 95, 0.4); }
        }

        .header { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            padding: 10px 16px; 
            border-bottom: 1px solid var(--card-border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .header.hidden { display: none !important; }

        .logo { font-size: 18px; font-weight: 900; background: linear-gradient(135deg, #00f2fe, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 6px; }
        .balance-badge { background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; font-weight: 800; color: var(--accent-green); font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3); }
        
        .container { padding: 8px; max-width: 500px; margin: 0 auto; position: relative; z-index: 10; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .game-step { display: none; }
        .game-step.active { display: block; }

        .navbar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; padding: 8px 0; 
            border-top: 1px solid var(--card-border); z-index: 1000; 
        }
        .nav-item { color: var(--text-sub); text-decoration: none; font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary-cyan); }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }

        .card { background: var(--card-bg); backdrop-filter: blur(8px); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--card-border); }
        .btn { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none; padding: 12px; border-radius: 10px; width: 100%; font-size: 15px; cursor: pointer; font-weight: 800; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3); }
        
        .bottom-actions-wrapper { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; width: 100%; }
        .btn-bingo-small { 
            background: linear-gradient(135deg, #ff2a5f, #e11d48); 
            font-size: 16px; padding: 12px; border-radius: 12px; 
            cursor: pointer; color: #fff; font-weight: 900; border: none; text-align: center; width: 100%; 
            animation: pulseGlow 2s infinite ease-in-out;
        }
        .btn-leave-small { 
            background: rgba(255, 42, 95, 0.1); 
            font-size: 11px; padding: 6px 12px; border-radius: 8px; 
            cursor: pointer; color: #fda4af; font-weight: 700; 
            border: 1px solid rgba(255, 42, 95, 0.3); text-align: center; align-self: flex-end; 
        }
        
        input, textarea, select { width: 100%; padding: 12px; margin-top: 8px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border); color: #fff; border-radius: 10px; outline: none; font-weight: 600; }

        .header-box { text-align: center; padding: 16px 0; }
        .header-box h2 { font-size: 19px; margin-bottom: 6px; color: var(--accent-amber); font-weight: 900; }
        .header-box p { font-size: 13px; color: var(--text-sub); }
        
        .welcome-promo-box {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(14, 165, 233, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 14px;
            border-radius: 14px;
            margin-top: 16px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .welcome-promo-box h4 {
            color: var(--primary-cyan);
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .welcome-promo-box p {
            color: var(--text-sub);
            font-size: 11px;
            line-height: 1.4;
        }

        .bet-selection-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .bet-grid-btn { 
            padding: 16px; font-size: 18px; font-weight: 800; 
            background: var(--card-bg); color: var(--accent-amber); 
            border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; 
            cursor: pointer; text-align: center; width: 100%; 
        }

        .top-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub); padding: 6px 4px; border-radius: 8px; text-align: center; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .stat-card span { display: block; font-size: 13px; color: #fff; margin-top: 2px; font-weight: 900; }

        .cards-grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 3px; 
            background: rgba(0, 0, 0, 0.5); 
            padding: 6px; 
            border-radius: 10px; 
            border: 1px solid var(--card-border); 
        }
        
        .card-btn { 
            background: rgba(255, 255, 255, 0.08); 
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            padding: 6px 0; 
            border-radius: 4px; 
            font-weight: 800; 
            font-size: 11px; 
            cursor: pointer; 
        }
        .card-btn.active { 
            background: linear-gradient(135deg, #00ff87, #10b981) !important; 
            color: #000000 !important; 
            font-weight: 900;
            box-shadow: 0 0 12px rgba(0, 255, 135, 0.9); 
            border: 1px solid #ffffff !important; 
        }
        .card-btn.taken { 
            background: linear-gradient(135deg, #ff003c, #cc0000) !important; 
            color: #ffffff !important; 
            cursor: not-allowed; 
            opacity: 0.9; 
            font-weight: 900;
        }

        .bottom-section { 
            margin-top: 8px; 
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.3), rgba(15, 23, 42, 0.7)); 
            padding: 8px 10px; 
            border-radius: 10px; 
            border: 1px solid rgba(168, 85, 247, 0.3); 
            display: flex; flex-direction: column; align-items: center;
        }
        .preview-label { font-size: 10px; font-weight: 800; color: #c084fc; margin-bottom: 4px; text-transform: uppercase; }
        .preview-ticket { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; 
            background: rgba(0, 0, 0, 0.4); padding: 5px; border-radius: 6px; width: 100%; max-width: 240px; 
        }
        .preview-cell { 
            background: rgba(126, 34, 206, 0.25); color: #f3e8ff; font-size: 11px; font-weight: 800; 
            text-align: center; padding: 4px 0; border-radius: 3px; border: 1px solid rgba(168, 85, 247, 0.2); 
        }
        .preview-cell.free { background: var(--accent-green); color: #fff; font-weight: 900; }

        .action-column { display: flex; gap: 8px; margin-top: 8px; width: 100%; }
        .btn-start-game { flex: 2; background: linear-gradient(135deg, var(--primary-cyan), #0284c7); color: #070a12; border: none; padding: 10px; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 900; text-align: center; }
        .btn-back-small { flex: 1; background: rgba(255, 255, 255, 0.05); color: var(--accent-amber); border: 1px solid var(--card-border); padding: 10px; border-radius: 10px; font-size: 12px; cursor: pointer; font-weight: 700; text-align: center; }

        .game-layout { display: flex; gap: 8px; justify-content: space-between; height: calc(100vh - 190px); min-height: 440px; }
        .called-grid-container { 
            background: var(--card-bg); padding: 8px; border-radius: 12px; 
            width: 48%; border: 1px solid var(--card-border); display: flex; flex-direction: column; height: 100%; overflow: hidden;
        }
        .bingo-header-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-bottom: 6px; text-align: center; font-weight: 900; font-size: 11px; }
        
        .b-header { background: var(--accent-amber); color: #000; border-radius: 4px; padding: 4px 0; }
        .i-header { background: var(--accent-green); color: #fff; border-radius: 4px; padding: 4px 0; }
        .n-header { background: #0284c7; color: #fff; border-radius: 4px; padding: 4px 0; }
        .g-header { background: var(--accent-rose); color: #fff; border-radius: 4px; padding: 4px 0; }
        .o-header { background: var(--accent-purple); color: #fff; border-radius: 4px; padding: 4px 0; }

        .called-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; flex: 1; overflow-y: auto; }
        .grid-num { background: rgba(0, 0, 0, 0.4); color: var(--text-sub); font-size: 12px; text-align: center; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 800; border: 1px solid rgba(255, 255, 255, 0.02); }
        
        .grid-num.called { 
            background: rgba(180, 40, 60, 0.4) !important; 
            color: #d1d5db !important; 
            font-weight: 700; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        
        .grid-num.called.latest-call { 
            background: linear-gradient(135deg, #f59e0b, #d97706) !important; 
            color: #000000 !important; 
            font-weight: 900 !important; 
            font-size: 12px !important;
            border: 2px solid #ffffff !important; 
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.9);
            z-index: 5;
        }

        .right-panel { width: 50%; display: flex; flex-direction: column; gap: 6px; height: 100%; }
        .countdown-box { background: var(--card-bg); color: var(--text-main); padding: 8px 10px; border-radius: 10px; display: flex; justify-content: space-between; font-weight: 800; font-size: 11px; border: 1px solid var(--card-border); }
        .current-call-box { background: var(--card-bg); padding: 8px 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--primary-cyan); }
        .call-text { font-size: 11px; font-weight: 800; color: var(--text-sub); }
        .call-circle { background: linear-gradient(135deg, var(--accent-amber), #f97316); color: #000; font-weight: 900; padding: 6px 12px; border-radius: 20px; font-size: 14px; }

        .recent-calls { display: flex; gap: 4px; overflow-x: auto; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 8px; min-height: 32px; align-items: center; border: 1px solid var(--card-border); }
        .recent-ball { background: #0284c7; color: white; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 12px; white-space: nowrap; }

        /* --- ሙሉ በሙሉ ወደ ታች እንዲዘረጋ የተስተካከለ የዩዘር ቦርድ ክፍል --- */
        .user-board { 
            background: var(--card-bg); 
            padding: 8px; 
            border-radius: 12px; 
            border: 1px solid var(--card-border); 
            flex: 1; /* የቀረውን ቁመት ሙሉ በሙሉ እንዲወስድ ይደረጋል */
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            margin-top: 0; 
        }
        .board-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(5, 1fr); 
            gap: 4px; 
            flex: 1; 
            margin-top: 4px; 
        }
        .board-cell { 
            background: rgba(0,0,0,0.3); 
            color: #fff; 
            font-size: 12px; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 4px; 
            cursor: pointer; 
            border: 1px solid var(--card-border); 
            height: 100%; /* የሳጥኖቹ ቁመት ከቦርዱ ቁመት ጋር ተመጣጣኝ እንዲሆን */
        }
        .board-cell.free, .board-cell.marked { background: var(--accent-green); color: white; border-color: #34d399; }
        .board-footer { text-align: center; font-size: 10px; color: var(--text-sub); margin-top: 4px; font-weight: 800; }
        /* ---------------------------------------------------------------- */

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 2000; padding: 16px; }
        .modal-card { background: linear-gradient(135deg, #1e1b4b, #0f172a); width: 100%; max-width: 360px; padding: 20px; border-radius: 20px; text-align: center; border: 1px solid var(--accent-purple); color: #fff; }
        .winner-title-box { background: linear-gradient(135deg, var(--accent-amber), #f97316); color: #000; padding: 12px; border-radius: 12px; font-size: 24px; font-weight: 900; margin-bottom: 8px; animation: pulseGlow 1.5s infinite; }
        .winner-subtitle { font-size: 13px; font-weight: 700; color: #e9d5ff; margin-bottom: 14px; }
        .modal-board-wrapper { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; margin-bottom: 14px; border: 1px solid rgba(168, 85, 247, 0.3); }
        .modal-bingo-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-bottom: 4px; font-weight: 900; font-size: 11px; }
        .modal-board-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
        .modal-cell { background: rgba(255,255,255,0.05); color: #f3e8ff; font-size: 12px; font-weight: 800; text-align: center; padding: 8px 0; border-radius: 4px; }
        .modal-cell.win-orange { background: #f97316 !important; color: #fff !important; }
        .modal-cell.win-green { background: var(--accent-green) !important; color: #fff !important; }
        .modal-footer-info { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 11px; background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 8px; }
        .modal-badge-name { background: #0d9488; color: #fff; padding: 4px 8px; border-radius: 6px; font-weight: 800; }
        .play-again-btn { background: linear-gradient(135deg, var(--accent-amber), #f97316); color: #000; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; }

        .wallet-banner {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(2, 132, 199, 0.2));
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            text-align: center;
        }
        .wallet-banner h4 { color: var(--accent-green); font-size: 15px; font-weight: 900; margin-bottom: 4px; }
        .wallet-banner p { color: var(--text-sub); font-size: 12px; }
        
        .instruction-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--accent-amber);
            padding: 10px;
            font-size: 11px;
            color: var(--text-sub);
            border-radius: 4px;
            margin: 8px 0;
            line-height: 1.5;
        }

        .btn-share-phone {
            background: linear-gradient(135deg, #0088cc, #0284c7);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }
    </style>
